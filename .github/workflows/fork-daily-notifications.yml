name: Silora Daily Notifications

on:
  workflow_run:
    workflows: [Silora Daily, Silora Manual Release]
    branches: [main]
    types: [in_progress, completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: >-
      github.repository == 'SiloraOSS/silora-android' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # workflow_run uses the default branch's trusted source, never the
      # triggering run's head commit, artifacts, or caches.
      - name: Check out notification tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Notify Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.SILORA_DAILY_DISCORD_WEBHOOK_URL }}
          DISCORD_CHANNEL_ID: ${{ vars.SILORA_DAILY_DISCORD_CHANNEL_ID }}
          DISCORD_FAILURE_USER_IDS: ${{ vars.SILORA_DAILY_FAILURE_USER_IDS }}
        run: python3 scripts/notify-fork-daily.py
